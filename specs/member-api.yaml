openapi: 3.0.3
info:
  title: Member API
  version: 1.0.0
  description: Sample API used to demo the onboarding automation.
  contact:
    name: API Platform Team
    email: api-platform@example.com
servers:
  - url: https://api.example.com/member-api/v1
security:
  - apiKey: []
tags:
  - name: members
    description: Member records
  - name: addresses
    description: Member addresses
paths:
  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: List members
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
    post:
      tags: [members]
      operationId: createMember
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Member" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/{memberId}:
    get:
      tags: [members]
      operationId: getMemberById
      summary: Get one member
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "404":
          description: Not found
  /members/{memberId}/addresses:
    get:
      tags: [addresses]
      operationId: listMemberAddresses
      summary: List a member's addresses
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Address" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Member:
      type: object
      required: [memberId, firstName, lastName]
      properties:
        memberId: { type: string }
        firstName: { type: string, maxLength: 50 }
        lastName: { type: string, maxLength: 50 }
        dateOfBirth: { type: string, format: date }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
    Address:
      type: object
      required: [line1, city, state, zip]
      properties:
        line1: { type: string }
        city: { type: string }
        state: { type: string, minLength: 2, maxLength: 2 }
        zip: { type: string, pattern: "^[0-9]{5}$" }
    MemberRecord:
      type: object
      description: Legacy wrapper, good candidate for the rename demo.
      properties:
        member: { $ref: "#/components/schemas/Member" }
        lastUpdated: { type: string, format: date-time }
