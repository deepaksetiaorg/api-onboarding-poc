# When someone closes a step issue by hand, check whether the whole API request is done.
# (Closes done by the bot already run this check, because GITHUB_TOKEN events don't trigger workflows.)
name: "Progress check"

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  check-parent:
    if: contains(github.event.issue.labels.*.name, 'api-step')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ADO_ORG_URL: ${{ vars.ADO_ORG_URL }}
      ADO_PROJECT: ${{ vars.ADO_PROJECT }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
      ADO_DONE_STATE: ${{ vars.ADO_DONE_STATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/report.py check-parent --child ${{ github.event.issue.number }}
